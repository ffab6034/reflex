<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReflexTap - Home</title>
    <link rel="stylesheet" href="home.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="home-container" id="main-content">
        <div id="screen-home">
            <h1>Welcome to ReflexTap</h1>
            <div class="tabs">
                <div class="tab" data-game="tab">
                    <span class="tab-icon">🎮</span>
                    <span class="tab-title">Tab to Earn</span>
                    <span class="tab-desc">Tap as fast as you can to earn points!</span>
                </div>
                <div class="tab" data-game="number">
                    <span class="tab-icon">🔢</span>
                    <span class="tab-title">Number to Earn</span>
                    <span class="tab-desc">Pick the right number to win rewards!</span>
                </div>
                <div class="tab" data-game="emoji">
                    <span class="tab-icon">😊</span>
                    <span class="tab-title">Choose Emoji to Earn</span>
                    <span class="tab-desc">Select the correct emoji and earn!</span>
                </div>
            </div>
        </div>
        <div id="screen-deposit" style="display:none;">
            <h1>Deposit</h1>
            <div id="current-balance" style="text-align: center; font-size: 1.2rem; margin-bottom: 1rem;">
                Loading balance...
            </div>
            <div class="plans">
                <div class="plan-card" data-amount="49" data-plan="Starter">
                    <div class="plan-amount">₹49</div>
                    <div class="plan-desc">Starter Plan</div>
                </div>
                <div class="plan-card" data-amount="99" data-plan="Pro">
                    <div class="plan-amount">₹99</div>
                    <div class="plan-desc">Pro Plan</div>
                </div>
                <div class="plan-card" data-amount="149" data-plan="Elite">
                    <div class="plan-amount">₹149</div>
                    <div class="plan-desc">Elite Plan</div>
                </div>
            </div>
            <div id="profile-section" style="margin-top:1.2rem;"></div>
        </div>
        <div id="screen-profile" style="display:none;">
            <h1>Profile</h1>
            <div style="margin-top:2rem;">
                <p id="profile-info">Loading...</p>
            </div>
        </div>
    </div>
    <div class="navbar">
        <button class="navbar-btn active" id="nav-home" onclick="showScreen('home')">
            <span class="icon">🏠</span>
            Home
        </button>
        <button class="navbar-btn" id="nav-deposit" onclick="showScreen('deposit')">
            <span class="icon">💰</span>
            Deposit
        </button>
        <button class="navbar-btn" id="nav-profile" onclick="showScreen('profile')">
            <span class="icon">👤</span>
            Profile
        </button>
    </div>
    <script src="home.js"></script>
</body>
</html>
