<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Embedded CSS -->
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: #fff;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(76, 68, 182, 0.2);
      max-width: 350px;
      width: 100%;
    }

    .login-form h2 {
      margin-bottom: 1.5rem;
      color: #764ba2;
      text-align: center;
    }

    .input-group {
      margin-bottom: 1.2rem;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.4rem;
      color: #333;
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      padding: 0.7rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #764ba2;
      outline: none;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.8rem;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button[type="submit"]:hover {
      background: linear-gradient(90deg, #764ba2 0%, #667eea 100%);
    }

    #message {
      margin-top: 1rem;
      text-align: center;
      color: #e53e3e;
      font-size: 0.95rem;
    }

    @media (max-width: 500px) {
      .login-container {
        padding: 1.5rem 1rem;
        max-width: 95vw;
      }

      .login-form h2 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <form id="loginForm" class="login-form">
      <h2>Login</h2>
      <div class="input-group">
        <label for="name">Enter your name</label>
        <input type="text" id="name" required />
      </div>
      <div class="input-group">
        <label for="phone">Phone No</label>
        <input type="tel" id="phone" required pattern="[0-9]{10,}" />
      </div>
      <button type="submit">Login</button>
      <div id="message"></div>
    </form>
  </div>

  <!-- Embedded JS -->
  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCpZUZ_V-m1i71hB58T3QHKcapL_qs_49M",
      authDomain: "reflex-tap-7815f.firebaseapp.com",
      projectId: "reflex-tap-7815f",
      storageBucket: "reflex-tap-7815f.firebasestorage.app",
      messagingSenderId: "833157218846",
      appId: "1:833157218846:web:77bbf1c73b299004a1e40f",
      measurementId: "G-ZDHDZJ7J0B"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const loginForm = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();

      if (!phone.match(/^\d{10,}$/)) {
        messageDiv.style.color = "#e53e3e";
        messageDiv.textContent = "Phone must be 10+ digits.";
        return;
      }

      try {
        // Check if phone exists
        const query = await db.collection('logins').where('phone', '==', phone).limit(1).get();
        let userId;

        if (!query.empty) {
          // Existing user: Update name (keep balance)
          userId = query.docs[0].id;
          await db.collection('logins').doc(userId).update({ name });
        } else {
          // New user: Set balance = 0
          const docRef = await db.collection('logins').add({
            name,
            phone,
            balance: 0,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          userId = docRef.id;
        }

        localStorage.setItem('userId', userId);
        messageDiv.style.color = "#38a169";
        messageDiv.textContent = "Login successful! Redirecting...";
        setTimeout(() => window.location.href = "home.html", 1000);
      } catch (err) {
        messageDiv.style.color = "#e53e3e";
        messageDiv.textContent = "Error logging in. Try again.";
        console.error(err);
      }
    });
  </script>
</body>
</html>
