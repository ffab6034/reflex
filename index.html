<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      max-width: 360px;
      width: 100%;
    }

    .login-form h2 {
      color: #764ba2;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .input-group {
      margin-bottom: 1.2rem;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 500;
      color: #333;
    }

    .input-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #764ba2;
      outline: none;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.8rem;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button[type="submit"]:hover {
      background: linear-gradient(90deg, #764ba2 0%, #667eea 100%);
    }

    #message {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.95rem;
    }

    @media (max-width: 500px) {
      .login-container {
        padding: 2rem 1rem;
        max-width: 90vw;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <form id="loginForm" class="login-form">
      <h2>Login</h2>

      <div class="input-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" required placeholder="Enter your name" />
      </div>

      <div class="input-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" required pattern="[0-9]{10}" placeholder="10-digit phone number" />
      </div>

      <button type="submit">Login</button>
      <div id="message"></div>
    </form>
  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCpZUZ_V-m1i71hB58T3QHKcapL_qs_49M",
      authDomain: "reflex-tap-7815f.firebaseapp.com",
      projectId: "reflex-tap-7815f",
      storageBucket: "reflex-tap-7815f.appspot.com",
      messagingSenderId: "833157218846",
      appId: "1:833157218846:web:77bbf1c73b299004a1e40f",
      measurementId: "G-ZDHDZJ7J0B"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const loginForm = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();

      if (!/^\d{10}$/.test(phone)) {
        messageDiv.style.color = "#e53e3e";
        messageDiv.textContent = "Please enter a valid 10-digit phone number.";
        return;
      }

      try {
        const query = await db.collection('logins').where('phone', '==', phone).limit(1).get();
        let userId;

        if (!query.empty) {
          userId = query.docs[0].id;
          await db.collection('logins').doc(userId).update({ name });
        } else {
          const docRef = await db.collection('logins').add({
            name,
            phone,
            balance: 0,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          userId = docRef.id;
        }

        localStorage.setItem('userId', userId);
        messageDiv.style.color = "#38a169";
        messageDiv.textContent = "Login successful! Redirecting...";

        setTimeout(() => window.location.href = "home.html", 1000);
      } catch (error) {
        console.error("Login error:", error);
        messageDiv.style.color = "#e53e3e";
        messageDiv.textContent = "Login failed. Try again.";
      }
    });
  </script>
</body>
</html>
