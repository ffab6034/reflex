<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reflex-Tap | Login</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2b1055">
  <link rel="apple-touch-icon" href="icon-192.png" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #2b1055, #7597de);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: #fff;
      padding: 2.5rem 2rem;
      border-radius: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    h2 {
      color: #2b1055;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
      text-align: center;
    }

    .input-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: #333;
    }

    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      border: 2px solid #e2e2e2;
      border-radius: 12px;
      background-color: #fafafa;
      transition: 0.3s ease;
    }

    input:focus {
      border-color: #667eea;
      background-color: #fff;
      outline: none;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
    }

    #google-login {
      width: 100%;
      padding: 0.9rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      background: #ffffff;
      border: 1px solid #ccc;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.3s ease;
    }

    #google-login img {
      width: 20px;
      height: 20px;
    }

    #google-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    #message {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.95rem;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @media (max-width: 500px) {
      .login-container { padding: 2rem 1rem; }
      h2 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Reflex-Tap</h2>

    <div class="input-group">
      <label for="name">Your Name</label>
      <input type="text" id="name" placeholder="Enter your name" required />
    </div>

    <div class="input-group">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="10-digit phone number" pattern="[0-9]{10}" required />
    </div>

    <button id="google-login">
      <img src="https://developers.google.com/identity/images/g-logo.png" alt="G" />
      Sign in with Google
    </button>

    <div id="message"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCpZUZ_V-m1i71hB58T3QHKcapL_qs_49M",
      authDomain: "reflex-tap-7815f.firebaseapp.com",
      projectId: "reflex-tap-7815f",
      storageBucket: "reflex-tap-7815f.appspot.com",
      messagingSenderId: "833157218846",
      appId: "1:833157218846:web:77bbf1c73b299004a1e40f",
      measurementId: "G-ZDHDZJ7J0B"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const messageDiv = document.getElementById('message');
    const googleBtn = document.getElementById('google-login');

    googleBtn.addEventListener('click', async () => {
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();

      if (!name || !/^\d{10}$/.test(phone)) {
        messageDiv.style.color = "#e53e3e";
        messageDiv.textContent = "Please enter a valid name and 10-digit phone.";
        return;
      }

      const provider = new firebase.auth.GoogleAuthProvider();

      try {
        const result = await auth.signInWithPopup(provider);
        const user = result.user;
        const { displayName, email, photoURL, uid } = user;

        const userRef = db.collection("logins").doc(uid);
        const snapshot = await userRef.get();

        if (!snapshot.exists) {
          await userRef.set({
            name,
            phone,
            email,
            photoURL,
            balance: 0,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } else {
          await userRef.update({ name, phone }); // Optional update
        }

        localStorage.setItem("userId", uid);
        messageDiv.style.color = "#38a169";
        messageDiv.textContent = "Login successful! Redirecting...";
        setTimeout(() => window.location.href = "home.html", 1000);
      } catch (err) {
        console.error("Login error:", err.message);
        messageDiv.style.color = "#e53e3e";
        messageDiv.textContent = "Login failed: " + err.message;
      }
    });

    // Auto-login redirect
    auth.onAuthStateChanged(user => {
      if (user) {
        localStorage.setItem("userId", user.uid);
        window.location.href = "home.html";
      }
    });

    // PWA service worker is workings
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }
  </script>
</body>
</html>
