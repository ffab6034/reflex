<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reflex-Tap | Login</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #2b1055, #7597de);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .login-container {
      background: #fff;
      padding: 2.5rem 2rem;
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      0% {
        transform: translateY(50px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    h2 {
      text-align: center;
      color: #2b1055;
      margin-bottom: 2rem;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: #333;
    }

    input[type="text"],
    input[type="tel"] {
      width: 100%;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      border: 2px solid #e2e2e2;
      border-radius: 12px;
      transition: all 0.3s ease;
      background-color: #fafafa;
    }

    input:focus {
      border-color: #667eea;
      background-color: #fff;
      outline: none;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.9rem;
      font-size: 1.1rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(118, 75, 162, 0.4);
    }

    #message {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.95rem;
    }

    @media (max-width: 500px) {
      .login-container {
        padding: 2rem 1rem;
        border-radius: 18px;
      }

      h2 {
        font-size: 1.6rem;
      }

      input,
      button {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <form id="loginForm" class="login-form">
      <h2>Reflex-Tap</h2>

      <div class="input-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" required placeholder="Enter your name" />
      </div>

      <div class="input-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" required pattern="[0-9]{10}" placeholder="10-digit phone number" />
      </div>

      <button type="submit">Login</button>
      <div id="message"></div>
    </form>
  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCpZUZ_V-m1i71hB58T3QHKcapL_qs_49M",
      authDomain: "reflex-tap-7815f.firebaseapp.com",
      projectId: "reflex-tap-7815f",
      storageBucket: "reflex-tap-7815f.appspot.com",
      messagingSenderId: "833157218846",
      appId: "1:833157218846:web:77bbf1c73b299004a1e40f",
      measurementId: "G-ZDHDZJ7J0B"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const loginForm = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();

      if (!/^\d{10}$/.test(phone)) {
        messageDiv.style.color = "#e53e3e";
        messageDiv.textContent = "Please enter a valid 10-digit phone number.";
        return;
      }

      try {
        const query = await db.collection('logins').where('phone', '==', phone).limit(1).get();
        let userId;

        if (!query.empty) {
          userId = query.docs[0].id;
          await db.collection('logins').doc(userId).update({ name });
        } else {
          const docRef = await db.collection('logins').add({
            name,
            phone,
            balance: 0,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          userId = docRef.id;
        }

        localStorage.setItem('userId', userId);
        messageDiv.style.color = "#38a169";
        messageDiv.textContent = "Login successful! Redirecting...";

        setTimeout(() => window.location.href = "home.html", 1000);
      } catch (error) {
        console.error("Login error:", error);
        messageDiv.style.color = "#e53e3e";
        messageDiv.textContent = "Login failed. Try again.";
      }
    });
  </script>
</body>
</html>
