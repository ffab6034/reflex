<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reflex-Tap | Login</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2b1055">
  <link rel="apple-touch-icon" href="icon-192.png" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #2b1055, #7597de);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: #fff;
      padding: 2.5rem 2rem;
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      text-align: center;
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    h2 {
      color: #2b1055;
      margin-bottom: 2rem;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    #google-login {
      width: 100%;
      padding: 0.9rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      background: #ffffff;
      border: 1px solid #ccc;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.3s ease;
    }

    #google-login img {
      width: 20px;
      height: 20px;
    }

    #google-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    #message {
      margin-top: 1.2rem;
      font-size: 0.95rem;
      color: #444;
    }

    @media (max-width: 500px) {
      .login-container { padding: 2rem 1rem; }
      h2 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Reflex-Tap</h2>
    <button id="google-login">
      <img src="https://developers.google.com/identity/images/g-logo.png" alt="G" />
      Sign in with Google
    </button>
    <div id="message"></div>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCpZUZ_V-m1i71hB58T3QHKcapL_qs_49M",
      authDomain: "reflex-tap-7815f.firebaseapp.com",
      projectId: "reflex-tap-7815f",
      storageBucket: "reflex-tap-7815f.appspot.com",
      messagingSenderId: "833157218846",
      appId: "1:833157218846:web:77bbf1c73b299004a1e40f",
      measurementId: "G-ZDHDZJ7J0B"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const messageDiv = document.getElementById('message');
    const googleBtn = document.getElementById('google-login');

    // Sign in with Google
    googleBtn.addEventListener('click', async () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const result = await auth.signInWithPopup(provider);
        const user = result.user;
        const { displayName, email, photoURL, uid } = user;

        const userRef = db.collection("logins").doc(uid);
        const snapshot = await userRef.get();

        if (!snapshot.exists) {
          await userRef.set({
            name: displayName,
            email,
            photoURL,
            balance: 0,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }

        localStorage.setItem("userId", uid);
        messageDiv.style.color = "#38a169";
        messageDiv.textContent = "Login successful! Redirecting...";

        setTimeout(() => window.location.href = "home.html", 1000);
      } catch (err) {
        console.error("Sign-in Error:", err.message);
        messageDiv.style.color = "#e53e3e";
        messageDiv.textContent = "Login failed: " + err.message;
      }
    });

    // Auto-login if already signed in
    auth.onAuthStateChanged(user => {
      if (user) {
        localStorage.setItem("userId", user.uid);
        window.location.href = "home.html";
      }
    });

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }
  </script>
</body>
</html>
