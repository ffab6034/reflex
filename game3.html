<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reflex-Tap: Emoji Game</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #7F00FF;
      --secondary: #E100FF;
      --accent: #ffe600;
      --white: #ffffff;
      --gray: #f3f4f6;
      --dark: #1a1a2e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: var(--dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
      animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .game-container {
      background: #fff;
      padding: 2rem 1.5rem;
      border-radius: 24px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .app-bar {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: #fff;
      font-size: 1.3rem;
      padding: 1rem;
      font-weight: bold;
      border-radius: 16px;
      margin-bottom: 1rem;
      letter-spacing: 0.5px;
    }

    h2 {
      font-size: 1.2rem;
      color: var(--primary);
      margin-bottom: 1rem;
    }

    #target-emoji {
      font-size: 2rem;
      font-weight: bold;
      margin-left: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 64px);
      gap: 14px;
      justify-content: center;
      margin-top: 1rem;
    }

    .grid-btn {
      width: 64px;
      height: 64px;
      font-size: 2rem;
      border: none;
      background-color: var(--gray);
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .grid-btn:active {
      transform: scale(0.92);
    }

    .grid-btn.target {
      background: var(--secondary);
      color: white;
      font-weight: bold;
      transform: scale(1.05);
    }

    .grid-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #game-message {
      font-size: 1rem;
      margin-top: 1.2rem;
      color: var(--primary);
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: repeat(4, 48px);
        gap: 10px;
      }

      .grid-btn {
        width: 48px;
        height: 48px;
        font-size: 1.5rem;
        border-radius: 12px;
      }

      .game-container {
        padding: 1.2rem;
      }

      .app-bar {
        font-size: 1.1rem;
        padding: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="app-bar">🎮 Reflex-Tap: Emoji Game</div>
    <h2>Tap the Emoji: <span id="target-emoji">❓</span></h2>
    <div id="grid" class="grid"></div>
    <div id="game-message"></div>
  </div>

  <!-- Game Logic -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCpZUZ_V-m1i71hB58T3QHKcapL_qs_49M",
      authDomain: "reflex-tap-7815f.firebaseapp.com",
      projectId: "reflex-tap-7815f",
      storageBucket: "reflex-tap-7815f.appspot.com",
      messagingSenderId: "833157218846",
      appId: "1:833157218846:web:77bbf1c73b299004a1e40f",
      measurementId: "G-ZDHDZJ7J0B"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const emojis = ["😀","😂","😎","😍","😜","😡","😱","😇","🥳","🤩","😴","😈","🤠","😷","🥶","🤡"];
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('roomId');
    const userId = localStorage.getItem('userId') || 'user_' + Math.random().toString(36).substring(2, 10);
    const roomRef = db.collection('games').doc('emoji').collection('rooms').doc(roomId);
    const gameRef = roomRef.collection('game').doc('state');

    let clicked = false;
    let startTime = null;

    async function setupGame() {
      await db.runTransaction(async tx => {
        const gameDoc = await tx.get(gameRef);
        if (!gameDoc.exists) {
          const targetEmoji = emojis[Math.floor(Math.random() * emojis.length)];
          const targetIndex = Math.floor(Math.random() * 16);
          const grid = Array.from({ length: 16 }, (_, i) =>
            i === targetIndex ? targetEmoji : emojis[Math.floor(Math.random() * emojis.length)]
          );
          tx.set(gameRef, {
            targetEmoji,
            targetIndex,
            grid,
            results: {},
            finished: false,
            startTime: firebase.firestore.Timestamp.now()
          });
        }
      });

      gameRef.onSnapshot(doc => {
        const data = doc.data();
        if (!data) return;
        document.getElementById('target-emoji').textContent = data.targetEmoji;
        startTime = data.startTime.toDate();
        renderGrid(data.grid, data.targetIndex);
        if (!clicked) startCountdown(startTime);
        if (data.finished) showResults(data.results);
      });
    }

    function renderGrid(gridArray, targetIndex) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      gridArray.forEach((emoji, i) => {
        const btn = document.createElement('button');
        btn.className = 'grid-btn' + (i === targetIndex ? ' target' : '');
        btn.textContent = emoji;
        btn.disabled = clicked;
        btn.onclick = () => handleClick(i, targetIndex);
        grid.appendChild(btn);
      });
    }

    async function handleClick(index, targetIndex) {
      if (clicked || index !== targetIndex) return;
      clicked = true;
      const reactionTime = new Date() - startTime;
      const gameDoc = await gameRef.get();
      const results = gameDoc.data().results || {};
      if (!results[userId]) {
        await gameRef.set({ [`results.${userId}`]: reactionTime }, { merge: true });
      }
      showResultsDialog();
    }

    function startCountdown(startTime) {
      const timer = setInterval(async () => {
        const elapsed = (new Date() - startTime) / 1000;
        if (elapsed >= 8) {
          clearInterval(timer);
          await gameRef.update({ finished: true });
        }
      }, 200);
    }

    function showResultsDialog() {
      const dialog = document.createElement('div');
      dialog.style.cssText = `
        position:fixed;top:0;left:0;width:100vw;height:100vh;
        background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:1000;
      `;
      dialog.innerHTML = `
        <div style="background:#fff;padding:2em 1.5em;border-radius:18px;min-width:280px;text-align:center;">
          <div id="leaderboard-content">⏳ Waiting for all players...</div>
        </div>`;
      document.body.appendChild(dialog);

      const check = setInterval(async () => {
        const [roomSnap, gameSnap] = await Promise.all([roomRef.get(), gameRef.get()]);
        const players = roomSnap.data()?.players || [];
        const results = gameSnap.data()?.results || {};
        const finished = gameSnap.data()?.finished;
        const allTapped = players.every(uid => results[uid]);

        if (allTapped || finished) {
          clearInterval(check);
          showFinalResults(results, players);
        }
      }, 600);
    }

    function showFinalResults(results, players = []) {
      const userIds = players.length ? players : Object.keys(results);
      db.collection('logins')
        .where(firebase.firestore.FieldPath.documentId(), 'in', userIds.slice(0, 10))
        .get()
        .then(snapshot => {
          const nameMap = {};
          snapshot.forEach(doc => nameMap[doc.id] = doc.data().name || doc.id);

          const entries = Object.entries(results).filter(([uid]) => userIds.includes(uid)).sort((a, b) => a[1] - b[1]);
          const winner = entries[0];

          let html = `<b>🏁 Game Over!</b><br><br>`;
          html += `<div style="font-size:1.1em;font-weight:bold;color:#38a169;">🏆 Winner: ${nameMap[winner[0]] || winner[0]} (${winner[1]} ms)</div><br>`;
          html += `<table style="margin:0 auto;"><tr><th>Rank</th><th>Name</th><th>Time (ms)</th></tr>`;
          entries.forEach(([uid, time], i) => {
            html += `<tr${uid === userId ? ' style="font-weight:bold;color:#764ba2;"' : ''}><td>${i+1}</td><td>${nameMap[uid] || uid}</td><td>${time}</td></tr>`;
          });
          html += `</table><br><button id="back-lobby-btn" style="padding:0.5em 1.2em;border-radius:8px;background:var(--primary);color:#fff;font-weight:bold;border:none;cursor:pointer;">Back to Lobby (<span id="back-timer">5</span>s)</button>`;
          document.getElementById('leaderboard-content').innerHTML = html;

          let timer = 5;
          const backInterval = setInterval(() => {
            timer--;
            document.getElementById('back-timer').textContent = timer;
            if (timer <= 0) {
              clearInterval(backInterval);
              window.location.href = 'home.html';
            }
          }, 1000);

          document.getElementById('back-lobby-btn').onclick = () => window.location.href = 'home.html';
        });
    }

    function showResults(results) {
      document.getElementById('game-message').textContent = "🎮 Game Over!";
    }

    setupGame();
  </script>
</body>
</html>
