<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Emoji Game</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Styles -->
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-container {
      background: #fff;
      padding: 2rem 1.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(76, 68, 182, 0.18);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    h2 {
      color: #764ba2;
      margin-bottom: 1.2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 60px);
      grid-template-rows: repeat(4, 60px);
      gap: 12px;
      justify-content: center;
      margin-bottom: 1.2rem;
    }

    .grid-btn {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      border: none;
      font-size: 2rem;
      background: #e2e8f0;
      cursor: pointer;
      transition: background 0.2s;
    }

    .grid-btn.target {
      background: #667eea;
      color: #fff;
    }

    #game-message {
      font-size: 1.1rem;
      color: #764ba2;
      margin-top: 0.5rem;
    }

    @media (max-width: 600px) {
      .game-container {
        padding: 1rem 0.3rem;
        max-width: 98vw;
      }

      .grid {
        grid-template-columns: repeat(4, 40px);
        grid-template-rows: repeat(4, 40px);
        gap: 7px;
      }

      .grid-btn {
        width: 40px;
        height: 40px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h2>Tap the Emoji: <span id="target-emoji"></span></h2>
    <div id="grid" class="grid"></div>
    <div id="game-message"></div>
  </div>

  <!-- Game Logic -->
  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCpZUZ_V-m1i71hB58T3QHKcapL_qs_49M",
      authDomain: "reflex-tap-7815f.firebaseapp.com",
      projectId: "reflex-tap-7815f",
      storageBucket: "reflex-tap-7815f.firebasestorage.app",
      messagingSenderId: "833157218846",
      appId: "1:833157218846:web:77bbf1c73b299004a1e40f",
      measurementId: "G-ZDHDZJ7J0B"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('roomId');
    const userId = 'user_' + Math.random().toString(36).substr(2, 9);

    const roomRef = db.collection('games').doc('emoji').collection('rooms').doc(roomId);
    const gameRef = roomRef.collection('game').doc('state');

    const emojis = ["😀","😂","😎","😍","😜","😡","😱","😇","🥳","🤩","😴","😈","🤠","😷","🥶","🤡"];
    let startTime = null;
    let clicked = false;

    async function setupGame() {
      await db.runTransaction(async (tx) => {
        const gameDoc = await tx.get(gameRef);
        if (!gameDoc.exists) {
          const targetIndex = Math.floor(Math.random() * 16);
          const targetEmoji = emojis[Math.floor(Math.random() * emojis.length)];
          const grid = Array.from({ length: 16 }, (_, i) =>
            i === targetIndex ? targetEmoji : emojis[Math.floor(Math.random() * emojis.length)]
          );
          tx.set(gameRef, {
            targetEmoji,
            grid,
            targetIndex,
            startTime: firebase.firestore.Timestamp.now(),
            results: {},
            finished: false
          });
        }
      });

      gameRef.onSnapshot(doc => {
        const data = doc.data();
        if (!data) return;
        startTime = data.startTime.toDate();
        document.getElementById('target-emoji').textContent = data.targetEmoji;
        renderGrid(data.grid, data.targetIndex);
        if (!clicked) startCountdown(startTime);
        if (data.finished) showResults(data.results);
      });
    }

    function renderGrid(gridArr, targetIndex) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      gridArr.forEach((emoji, i) => {
        const btn = document.createElement('button');
        btn.className = 'grid-btn' + (i === targetIndex ? ' target' : '');
        btn.textContent = emoji;
        btn.disabled = clicked;
        btn.onclick = () => handleClick(i, targetIndex);
        grid.appendChild(btn);
      });
    }

    async function handleClick(i, targetIndex) {
      if (clicked || i !== targetIndex) return;
      clicked = true;
      const reactionTime = new Date() - startTime;
      const gameDoc = await gameRef.get();
      const results = (gameDoc.exists && gameDoc.data().results) || {};
      if (!results[userId]) {
        await gameRef.set({ [`results.${userId}`]: reactionTime }, { merge: true });
      }
      showResultsDialog();
    }

    function startCountdown(startTime) {
      const interval = setInterval(async () => {
        const elapsed = (new Date() - startTime) / 1000;
        if (elapsed >= 8) {
          clearInterval(interval);
          await gameRef.update({ finished: true });
        }
      }, 200);
    }

    function showResultsDialog() {
      const dialog = document.createElement('div');
      dialog.style.cssText = `position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;`;
      dialog.innerHTML = `<div style="background:#fff;padding:2em 1.5em;border-radius:16px;min-width:280px;text-align:center;">
        <div id="leaderboard-content">Waiting for all players...</div>
      </div>`;
      document.body.appendChild(dialog);

      const poll = setInterval(async () => {
        const [roomSnap, gameSnap] = await Promise.all([roomRef.get(), gameRef.get()]);
        const players = roomSnap.data()?.players || [];
        const results = gameSnap.data()?.results || {};
        const finished = gameSnap.data()?.finished;
        const allTapped = players.every(uid => results[uid]);

        if (allTapped || finished) {
          clearInterval(poll);
          const userIds = players.length ? players : Object.keys(results);
          db.collection('logins').where(firebase.firestore.FieldPath.documentId(), 'in', userIds.slice(0, 10)).get()
            .then(snapshot => {
              const nameMap = {};
              snapshot.forEach(doc => nameMap[doc.id] = doc.data().name || doc.id);
              const entries = Object.entries(results).filter(([uid]) => userIds.includes(uid)).sort((a, b) => a[1] - b[1]);
              const winner = entries[0];
              let html = `<b>Game Over!</b><br><br>`;
              html += `<div style="font-size:1.1em;font-weight:bold;color:#38a169;">🏆 Winner: ${nameMap[winner[0]] || winner[0]} (${winner[1]} ms)</div><br>`;
              html += `<table style="margin:0 auto;"><tr><th>Rank</th><th>Name</th><th>Time (ms)</th></tr>`;
              entries.forEach(([uid, time], i) => {
                html += `<tr${uid === userId ? ' style="font-weight:bold;color:#764ba2;"' : ''}><td>${i+1}</td><td>${nameMap[uid] || uid}</td><td>${time}</td></tr>`;
              });
              html += `</table><br><button id="back-lobby-btn" style="padding:0.5em 1.2em;border-radius:8px;background:#764ba2;color:#fff;font-weight:bold;border:none;cursor:pointer;">Back to Lobby (<span id="back-timer">5</span>s)</button>`;
              document.getElementById('leaderboard-content').innerHTML = html;

              let timer = 5;
              const countdown = setInterval(() => {
                timer--;
                document.getElementById('back-timer').textContent = timer;
                if (timer <= 0) {
                  clearInterval(countdown);
                  window.location.href = "home.html";
                }
              }, 1000);
              document.getElementById('back-lobby-btn').onclick = () => window.location.href = "home.html";
            });
        }
      }, 700);
    }

    function showResults(results) {
      const msgDiv = document.getElementById('game-message');
      if (!results) return msgDiv.textContent = "Game Over!";
      const userIds = Object.keys(results);
      db.collection('logins').where(firebase.firestore.FieldPath.documentId(), 'in', userIds.slice(0,10)).get()
        .then(snapshot => {
          const nameMap = {};
          snapshot.forEach(doc => nameMap[doc.id] = doc.data().name || doc.id);
          const entries = Object.entries(results).sort((a,b) => a[1] - b[1]);
          const winner = entries[0];
          let html = `<b>Game Over!</b><br><br>`;
          html += `<div style="font-size:1.1em;font-weight:bold;color:#38a169;">🏆 Winner: ${nameMap[winner[0]] || winner[0]} (${winner[1]} ms)</div><br>`;
          html += `<table style="margin:0 auto;"><tr><th>Rank</th><th>Name</th><th>Time (ms)</th></tr>`;
          entries.forEach(([uid, time], i) => {
            html += `<tr${uid === userId ? ' style="font-weight:bold;color:#764ba2;"' : ''}><td>${i+1}</td><td>${nameMap[uid] || uid}</td><td>${time}</td></tr>`;
          });
          html += `</table><br><button id="back-lobby-btn" style="padding:0.5em 1.2em;border-radius:8px;background:#764ba2;color:#fff;font-weight:bold;border:none;cursor:pointer;">Back to Lobby (<span id="back-timer">5</span>s)</button>`;
          msgDiv.innerHTML = html;

          let timer = 5;
          const interval = setInterval(() => {
            timer--;
            document.getElementById('back-timer').textContent = timer;
            if (timer <= 0) {
              clearInterval(interval);
              window.location.href = "home.html";
            }
          }, 1000);
          document.getElementById('back-lobby-btn').onclick = () => window.location.href = "home.html";
        });
    }

    setupGame();
  </script>
</body>
</html>
